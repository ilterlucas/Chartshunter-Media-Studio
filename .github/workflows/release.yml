name: Build Windows Stable Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python source
        shell: pwsh
        run: |
          python -m py_compile src\app.py src\bootstrap.py src\maintenance.py src\self_test.py
          python src\self_test.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Windows launchers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\ChartshunterMediaStudio_v41 | Out-Null
          Push-Location launcher
          go build -trimpath -ldflags "-H windowsgui -s -w" -o "..\release\ChartshunterMediaStudio_v41\Chartshunter Media Studio.exe" main.go
          go build -trimpath -ldflags "-H windowsgui -s -w" -o "..\release\ChartshunterMediaStudio_v41\Repair & Update.exe" repair.go
          Pop-Location

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $dst = "release\ChartshunterMediaStudio_v41"
          Copy-Item src\app.py $dst
          Copy-Item src\bootstrap.py $dst
          Copy-Item src\maintenance.py $dst
          Copy-Item src\self_test.py $dst
          Copy-Item src\requirements.txt $dst
          Copy-Item README.md "$dst\README_TR.md"
          Copy-Item docs\KULLANIM_KILAVUZU_TR.md $dst
          Copy-Item CHANGELOG.md "$dst\CHANGELOG_v41.md"
          Copy-Item docs\TEST_RAPORU_v41.txt $dst
          Copy-Item BUILD_INFO.json $dst
          Copy-Item chrome_capture_extension "$dst\chrome_capture_extension" -Recurse

          Get-FileHash "$dst\Chartshunter Media Studio.exe", "$dst\Repair & Update.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content "$dst\SHA256SUMS.txt"

          Compress-Archive -Path $dst -DestinationPath "release\ChartshunterMediaStudio_v41_Stable.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChartshunterMediaStudio-v41-Windows
          path: release/*

      - name: Publish or update v41 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags

          if (-not (git tag -l "v41")) {
            git tag v41
            git push origin v41
          }

          if (gh release view v41 *> $null) {
            gh release upload v41 `
              "release\ChartshunterMediaStudio_v41_Stable.zip" `
              "release\ChartshunterMediaStudio_v41\Chartshunter Media Studio.exe" `
              "release\ChartshunterMediaStudio_v41\Repair & Update.exe" `
              "release\ChartshunterMediaStudio_v41\SHA256SUMS.txt" `
              --clobber
          } else {
            gh release create v41 `
              "release\ChartshunterMediaStudio_v41_Stable.zip" `
              "release\ChartshunterMediaStudio_v41\Chartshunter Media Studio.exe" `
              "release\ChartshunterMediaStudio_v41\Repair & Update.exe" `
              "release\ChartshunterMediaStudio_v41\SHA256SUMS.txt" `
              --title "Chartshunter Media Studio v41 Stable" `
              --notes-file CHANGELOG.md
          }
